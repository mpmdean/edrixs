name: CI-Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build documentation from
        required: true
        default: master
        type: string
      docs_version:
        description: Published documentation version (for example, 0.1.3)
        required: true
        default: dev
        type: string
      make_stable:
        description: Also publish this build as stable
        required: true
        default: false
        type: boolean
  release:
    types: [published]

jobs:

  lint:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: pre-commit/action@v3.0.1

  test:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    name: Tests
    runs-on: ${{ matrix.host-os }}
    needs: lint

    strategy:
      matrix:
        include:
          - host-os: "ubuntu-latest"
            python-version: "3.10"
            numpy-spec: "numpy=1.26"
          - host-os: "ubuntu-latest"
            python-version: "3.11"
            numpy-spec: "numpy>=2"
          - host-os: "ubuntu-latest"
            python-version: "3.12"
            numpy-spec: "numpy>=2"
          - host-os: "ubuntu-latest"
            python-version: "3.13"
            numpy-spec: "numpy>=2"
          - host-os: "ubuntu-latest"
            python-version: "3.14"
            numpy-spec: "numpy>=2"
          - host-os: "macos-14"
            python-version: "3.14"
            numpy-spec: "numpy>=2"
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set env vars
        env:
          MANUAL_DOCS_VERSION: ${{ inputs.docs_version }}
        run: |
          export REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}  # just the repo, as opposed to org/repo
          echo "REPOSITORY_NAME=${REPOSITORY_NAME}" >> $GITHUB_ENV

          python_version="${{ matrix.python-version }}"
          export PYTHON_VERSION_NODOT="${python_version//\./}"
          echo "PYTHON_VERSION_NODOT=${PYTHON_VERSION_NODOT}" >> $GITHUB_ENV

          if [[ "${{ github.event_name }}" == "release" ]]; then
            docs_version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            docs_version="${MANUAL_DOCS_VERSION}"
          else
            docs_version="dev"
          fi
          echo "EDRIXS_DOCS_VERSION=${docs_version}" >> $GITHUB_ENV

      - name: Set MacOS Deployment Target
        if: runner.os == 'macOS'
        run: |
          export MACOSX_DEPLOYMENT_TARGET="10.15"
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV

      - name: Install micromamba with build dependencies
        uses: mamba-org/setup-micromamba@v3
        # if: runner.os == 'macOS'
        with:
          init-shell: bash
          environment-name: build-env
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ matrix.numpy-spec }}
            arpack=*=mpi_openmpi*
            gfortran
            openmpi

      # - name: Set up Python ${{ matrix.python-version }}
      #   # if: matrix.host-os != 'macos-latest'
      #   if: runner.os != 'macOS'
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          set -vxeuo pipefail
          brew install tree
      #     python -m pip install delocate

      - name: Install dependencies
        run: |
          set -vxeuo pipefail
          bash ./scripts/install-deps.sh
          tree .
          ls -Al .
          ls -Al ./dist/

      # - name: Delocate wheels for MacOS
      #   if: runner.os == '.'
      #   run: |
      #     set -vxeuo pipefail
      #     delocate-wheelpython -v ./dist/${{ env.REPOSITORY_NAME }}-*-cp${PYTHON_VERSION_NODOT}*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPOSITORY_NAME }}-${{ matrix.python-version }}-${{ matrix.host-os }}-wheel
          path: dist/*

      - name: Test with pytest
        run: |
          set -vxeuo pipefail
          bash ./scripts/run-tests.sh

      - name: Build Docs
        run: |
          set -vxeuo pipefail
          bash ./scripts/build-docs.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPOSITORY_NAME }}-${{ matrix.python-version }}-${{ matrix.host-os }}-docs
          path: docs/build/html/

      - name: Test versioned documentation assembly
        if: >-
          matrix.host-os == 'ubuntu-latest' &&
          matrix.python-version == '3.12' &&
          github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p docs/build/empty-site
          bash scripts/prepare-versioned-docs.sh \
            docs/build/html \
            docs/build/empty-site \
            docs/build/versioned-test \
            dev \
            false \
            .
          python -m json.tool docs/build/versioned-test/versions.json > /dev/null

  publish-docs:
    if: >-
      github.repository_owner == 'EDRIXS' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch')
    name: Deploy docs
    runs-on: ${{ matrix.host-os }}
    needs: test
    permissions:
      contents: write
    concurrency:
      group: docs-publish
      cancel-in-progress: false

    strategy:
      matrix:
        # host-os: ["ubuntu-latest", "macos-13", "macos-14"]
        host-os: ["ubuntu-latest"]
        python-version: ["3.12"]
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Select documentation version
        env:
          MANUAL_DOCS_VERSION: ${{ inputs.docs_version }}
          MANUAL_MAKE_STABLE: ${{ inputs.make_stable }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "DOCS_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "MAKE_STABLE=${{ github.event.release.prerelease == false }}" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "DOCS_VERSION=${MANUAL_DOCS_VERSION}" >> $GITHUB_ENV
            echo "MAKE_STABLE=${MANUAL_MAKE_STABLE}" >> $GITHUB_ENV
          else
            echo "DOCS_VERSION=dev" >> $GITHUB_ENV
            echo "MAKE_STABLE=false" >> $GITHUB_ENV
          fi

      - name: Set env vars
        run: |
          export REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}  # just the repo, as opposed to org/repo
          echo "REPOSITORY_NAME=${REPOSITORY_NAME}" >> $GITHUB_ENV

      - name: Checkout publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: publishing-tools

      - name: Checkout existing documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: existing-site

      - name: Download docs from GitHub artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.REPOSITORY_NAME }}-${{ matrix.python-version }}-${{ matrix.host-os }}-docs
          path: docs/build/html/

      - name: Assemble versioned documentation
        run: |
          bash publishing-tools/scripts/prepare-versioned-docs.sh \
            docs/build/html \
            existing-site \
            docs/build/versioned \
            "${DOCS_VERSION}" \
            "${MAKE_STABLE}" \
            publishing-tools

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/versioned/

  publish-to-pypi:
    # Hints from:
    #   - https://github.com/pypa/gh-action-pypi-publish/discussions/28
    #   - https://github.com/Lightning-AI/lightning/blob/master/.github/workflows/release-pypi.yml
    if: github.event_name == 'release'
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      matrix:
        # host-os: ["ubuntu-latest", "macos-13", "macos-14"]
        host-os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Set env vars
        run: |
          export REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}  # just the repo, as opposed to org/repo
          echo "REPOSITORY_NAME=${REPOSITORY_NAME}" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wheels from GitHub artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.REPOSITORY_NAME }}-${{ matrix.python-version }}-${{ matrix.host-os }}-wheel
          path: dist/

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/

  publish-docker:
    if: github.event_name == 'release' && github.event.action == 'published' && github.repository == 'EDRIXS/edrixs'
    name: Publish Docker image
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      push: true
      release_tag: ${{ github.event.release.tag_name }}
      publish_latest: ${{ ! github.event.release.prerelease }}
    secrets: inherit
