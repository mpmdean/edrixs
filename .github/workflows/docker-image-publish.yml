name: Republish Docker image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag to republish
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'EDRIXS/edrixs'
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ inputs.release_tag }}
      push: true
      release_tag: ${{ inputs.release_tag }}
      publish_latest: ${{ inputs.publish_latest }}
    secrets: inherit
